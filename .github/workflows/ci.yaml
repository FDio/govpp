---
name: CI
on:
  push:
    tags:
      - v*
    branches:
      - master
      - ci
  pull_request:
  # Allows running this workflow manually
  workflow_dispatch:

permissions:
  contents: read
  # Required to annotate pull requests with golangci-lint results.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  yaml-lint:
    name: "Lint YAML"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: "Run YAML linter"
        uses: ibiqlik/action-yamllint@2576378a8e339169678f9939646ee3ee325e845c # v3
        with:
          config_file: '.github/ci/yamllint.yml'

  markdownlint:
    name: "Lint Markdown"
    runs-on: ubuntu-latest
    steps:
      - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          fix: true
          globs: '**/*.md'

  go-mod:
    name: "Check go.mod"
    strategy:
      matrix:
        go: [ '1.26.1' ]
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: "Setup Go"
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: ${{ matrix.go }}
          cache: false

      - name: "Run go mod tidy"
        run: go mod tidy -v

      - name: "Check go.mod"
        run: |
          git diff --exit-code go.mod

      - name: "Check go.sum"
        run: |
          git diff --exit-code go.sum

  binapi:
    name: "Check generated binapi"
    strategy:
      matrix:
        go: [ '1.26.1' ]
    env:
      VERSION: v0.13.0
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: "Setup Go"
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: ${{ matrix.go }}
          cache: false

      - name: "Generate binapi"
        run: make gen-binapi-docker

      - name: "Check binapi"
        run: |
          git diff --exit-code binapi

  build-test:
    name: "Build and test"
    strategy:
      matrix:
        go: [ '1.26.1' ]
        os: [ ubuntu-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: "Setup Go"
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: ${{ matrix.go }}
          cache: false

      - name: "Setup gotestsum"
        uses: autero1/action-gotestsum@7263b9d73912eec65f46337689e59fac865c425f # v2.0.0
        with:
          gotestsum_version: 1.11.0

      - name: "Go Build"
        run: go build -v ./...

      - name: "Go Test"
        run: gotestsum --format testname --jsonfile test.json -- -race ./...

      - name: "Test results"
        if: always()
        uses: guyarb/golang-test-annotations@96fc379b171c49932041d6c789e73331a7bdeec1 # v0.9.0
        with:
          test-results: test.json

  golangci:
    name: "GolangCI"
    strategy:
      matrix:
        go: [ '1.26.1' ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # Required to annotate pull requests with golangci-lint results.
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: "Setup Go"
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: ${{ matrix.go }}
          cache: false

      - name: "Run golangci"
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9; docs: https://github.com/golangci/golangci-lint-action
        with:
          version: latest
