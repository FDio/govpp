---
name: Test
on:
  # Runs on branch push to master & PRs
  push:
    branches:
      - master
      - release/*
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
  # Runs daily at 05:05
  schedule:
    - cron: '5 5 * * *'
  # Allows running manually
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: "VPP Integration ${{ matrix.version }}"
    runs-on: ubuntu-latest
    env:
      VPP_REPO: ${{ matrix.version }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - 'master'
          - '2606'
          - '2602'
          - '2510'

    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: "Setup Go"
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: '1.26.1'
          cache: false

      - name: "Run Tests"
        run: |
          make test-integration
          make test-memory-benchmark
